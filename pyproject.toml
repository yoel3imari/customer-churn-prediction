[project]
name = "customer-churn-prediction"
version = "0.1.0"
description = "End-to-end customer churn prediction with Cell2Cell dataset"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.0",
    "missingno>=0.5.2",
    "numpy>=2.1.0,<2.5",
    "pandas>=2.2,<3",
    "scikit-learn>=1.9.0",
    "scipy>=1.16.0",
    "seaborn>=0.13.2",
    "mlflow>=2.20.0",
    "optuna>=4.2.0",
    "optuna-integration[mlflow]>=4.0.0",
    "xgboost>=2.1.0",
    "lightgbm>=4.6.0",
    "catboost>=1.2.0",
    "shap>=0.46.0",
    "numba>=0.64.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "streamlit>=1.41.0",
    "python-multipart>=0.0.19",
    "joblib>=1.4.0",
    "imbalanced-learn>=0.13.0",
    "psycopg2-binary>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
