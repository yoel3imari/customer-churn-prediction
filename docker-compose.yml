name: churn-prediction

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: ${MLFLOW_PG_PASSWORD:-mlflow}
      POSTGRES_DB: mlflow
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  mlflow:
    build:
      dockerfile: Dockerfile.mlflow
    entrypoint: >
      mlflow server
      --host 0.0.0.0
      --port 5005
      --backend-store-uri postgresql://mlflow:${MLFLOW_PG_PASSWORD:-mlflow}@postgres:5432/mlflow
      --default-artifact-root file:///mlflow/artifacts
      --registry-store-uri postgresql://mlflow:${MLFLOW_PG_PASSWORD:-mlflow}@postgres:5432/mlflow
    ports:
      - "5005:5005"
    environment:
      MLFLOW_SERVER_ALLOWED_HOSTS: "*"
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5005/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  app:
    build:
      context: .
      target: runtime
    volumes:
      - .:/app
      - /app/.venv  # don't shadow the image's .venv with host's
      - mlflow_artifacts:/mlflow/artifacts
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5005
      PYTHONPATH: /app
    profiles:
      - manual

  dashboard:
    build:
      context: .
      target: runtime
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      API_BASE_URL: http://app:8000/api/v1
      MLFLOW_TRACKING_URI: http://mlflow:5005
      PYTHONPATH: /app
    volumes:
      - ./dashboard:/app/dashboard
      - ./reports:/app/reports
    depends_on:
      - app
    profiles:
      - manual

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    profiles:
      - manual

volumes:
  postgres_data:
  mlflow_artifacts:


